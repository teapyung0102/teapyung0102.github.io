.wrap{max-width:460px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) var(--gutter) calc(40px + env(safe-area-inset-bottom,0px))}

/* 위: 로고 + 한 줄 소개 */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:32px}
.mark{width:76px;height:76px;border-radius:50%;border:4px solid var(--dawn);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;margin-bottom:12px}
.mark i{width:38px;height:19px;background:var(--dawn);border-radius:19px 19px 0 0}
.logo{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.3;letter-spacing:-.01em}
.lead{font-size:17px;font-weight:600;color:var(--night-text);text-wrap:balance}
.sub{font-size:14px;color:var(--night-sub)}

/* 버튼: 세로로 쭉, 아이콘은 왼쪽 · 글씨는 가운데 */
.links{display:flex;flex-direction:column;gap:12px}
.btn{display:grid;grid-template-columns:26px 1fr 26px;align-items:center;gap:12px;min-height:64px;padding:12px 18px;border-radius:16px;
  background:var(--night-2);border:1px solid var(--night-line);transition:transform .12s,border-color .12s,background .12s}
.btn svg{width:26px;height:26px;fill:none;stroke:var(--dawn);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn span{text-align:center;font-size:17px;font-weight:700;line-height:1.35}
.btn small{display:block;margin-top:2px;font-size:14px;font-weight:500;color:var(--night-sub)}
.btn:hover{border-color:var(--dawn)}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--dawn);border-color:var(--dawn);color:var(--ink)}
.btn.main svg{stroke:var(--ink)}
.btn.main small{color:var(--ink);opacity:.75}
.btn.main:hover{background:#E99A5E}

footer{margin-top:36px;text-align:center;font-size:13px;line-height:1.7;color:var(--night-mute)}
footer .logo{font-size:15px;color:var(--night-sub);margin-bottom:2px}

<!-- 방문자 수 (구글 애널리틱스). GA_ID에 측정 ID(G-로 시작)를 넣으면 세기 시작함. 네 페이지(메인·price·move·link) 같이 고칠 것.
     사장님 기기는 주소 끝에 #nocount 를 붙여 한 번 열면 그 브라우저 방문은 안 셈 (#count 로 되돌림) -->
<script>
(function(){
  var GA_ID='';
  function toggle(){
    try{
      if(location.hash==='#nocount'){localStorage.setItem('sb-nocount','1');alert('이 브라우저에서 들어온 방문은 이제 방문자 수에 안 들어가요.');}
      else if(location.hash==='#count'){localStorage.removeItem('sb-nocount');alert('이 브라우저 방문도 다시 방문자 수에 들어가요.');}
      else return;
      history.replaceState(null,'',location.pathname+location.search);
    }catch(e){}
  }
  toggle();addEventListener('hashchange',toggle);
  var off=false;
  try{off=localStorage.getItem('sb-nocount')==='1';}catch(e){}
  if(!GA_ID||off)return;
  var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments);};
  gtag('js',new Date());gtag('config',GA_ID);
})();
</script>
